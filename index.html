<!DOCTYPE html>
<html>
<head>
  <title>Reset Password Deep Link</title>
  <script>
    // Ambil token dari parameter URL
    function getTokenFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    // Update href saat halaman dimuat
    window.addEventListener('DOMContentLoaded', function() {
      const token = getTokenFromURL();
      if (token) {
        const link = document.getElementById('deepLink');
        link.href = `ls://reset-password?token=${token}`;
      }
    });
  </script>
</head>
<body>

<h1>Test Deep Link</h1>

<a id="deepLink" href="myapp://reset-password?token=default_token">
  Open App
</a>

</body>
</html>
